            \ Markdown 标记）：\n{\n  \"base_env\": \"你评估或提取出的静态环境描述（不含任何人物痕迹）\",\n  \"\
            story\": \"【当前：时间｜地点】\\n[包含NPC互动的完整叙事文本]\"\n}"
