          【独立行动 NPC：{npc2_name}】\\n{npc2_outer.strip()}\")\n        \n    if independent_npc_actions:\n\
          \        final_output += \"\\n【独立行动的NPC动作】\\n\" + \"\\n\\n\".join(independent_npc_actions)\
