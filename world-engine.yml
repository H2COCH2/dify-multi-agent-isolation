    - data:
        code: "import json\nimport re\n\ndef main(sub_narrative_data: str, mem_npc_database:\
          \ str, mem_location_db: str) -> dict:\n    # 1. 提取支线数据里提到的所有NPC名字\n    npc_names\
          \ = re.findall(r'【NPC：(.*?)】', sub_narrative_data)\n    db_dict = json.loads(mem_npc_database)\
          \ if mem_npc_database and mem_npc_database.strip() else {}\n    loc_dict\
          \ = json.loads(mem_location_db) if mem_location_db and mem_location_db.strip()\
          \ else {}\n    \n    time_str = \"未知时间\"\n    loc_name = \"未知地点\"\n    \n\
          \    # 2. 遍历所有NPC，从他们的记忆里寻找时间地点锚点\n    # 只要找到一个合法的，就直接确定，并停止寻找（因为同行状态下两人数据一致）\n\
          \    for npc_name in npc_names:\n        if npc_name in db_dict:\n     \
          \       memory = db_dict[npc_name].get(\"动态\", {}).get(\"记忆\", [])\n   \
          \         if memory:\n                # 从最后一条记忆（最新的）往前推，或者只看最后一条\n     \
          \           # 格式为：[时间 | 地点] xxx\n                match = re.search(r'\\\
          [(.*?)\\s*\\|\\s*(.*?)\\]', memory[-1])\n                if match:\n   \
          \                 time_str = match.group(1).strip()\n                  \
          \  loc_name = match.group(2).strip()\n                    break  # 找到一个就跳出循环\n\
          \    \n    # 3. 去环境库查找对应的基础环境\n    base_env = loc_dict.get(loc_name, \"\"\
          )\n    \n    return {\n        \"time_str\": time_str,\n        \"loc_name\"\
          : loc_name,\n        \"base_env\": base_env\n    }"
