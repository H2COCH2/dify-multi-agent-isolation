          【第一顺位NPC：{focus_npc}】\\n内心：{npc1_inner.strip()}\\n外部：{npc1_outer.strip()}\"\
          )\n        if focus_npc2 and (npc2_inner or npc2_outer):\n            main_parts.append(f\"\
          【第二顺位NPC：{focus_npc2}】\\n内心：{npc2_inner.strip()}\\n外部：{npc2_outer.strip()}\"\
          )\n\n    # 4. 返回结果\n    if not main_parts:\n        return {\"narrative_npc_data\"\
          : \"\", \"sub_narrative_data\": \"\\n\\n\".join(sub_parts)}\n        \n\
          \    return {\n        \"narrative_npc_data\": \"\\n\\n\".join(main_parts),\n\
          \        \"sub_narrative_data\": \"\\n\\n\".join(sub_parts)\n    }"
