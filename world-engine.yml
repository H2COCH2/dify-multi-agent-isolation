          \            if focus_npc and (npc1_inner or npc1_outer):\n            \
          \    sub_parts.append(f\"【NPC：{focus_npc}】\\n内心：{npc1_inner.strip()}\\n外部：{npc1_outer.strip()}\"\
          )\n            if focus_npc2 and (npc2_inner or npc2_outer):\n         \
          \       sub_parts.append(f\"【NPC：{focus_npc2}】\\n内心：{npc2_inner.strip()}\\\
          n外部：{npc2_outer.strip()}\")\n        return {\n            \"narrative_npc_data\"\
          : \"\",\n            \"sub_narrative_data\": \"\\n\\n\".join(sub_parts)\n\
          \        }\n    \n    # 3. 处理玩家与一人/两人的情况\n    if \"玩家与一人\" in player_area_status:\n\
          \        # 提取括号里的目标NPC名字（兼容中英文括号）\n        match = re.search(r'玩家与一人[（\\\
          (](.*?)[）\\)]', player_area_status)\n        target_name = match.group(1).strip()\
          \ if match else \"\"\n        \n        # 精准投喂：只打包对应目标的数据\n        if target_name\
          \ == focus_npc and (npc1_inner or npc1_outer):\n            main_parts.append(f\"\
          【第一顺位NPC：{focus_npc}】\\n内心：{npc1_inner.strip()}\\n外部：{npc1_outer.strip()}\"\
          )\n        elif target_name == focus_npc2 and (npc2_inner or npc2_outer):\n\
          \            main_parts.append(f\"【第一顺位NPC：{focus_npc2}】\\n内心：{npc2_inner.strip()}\\\
          n外部：{npc2_outer.strip()}\")\n        else:\n            # 兜底：如果名字没对上，默认打包第一顺位NPC的数据，防止叙事AI空转\n\
          \            if focus_npc and (npc1_inner or npc1_outer):\n            \
          \    main_parts.append(f\"【第一顺位NPC：{focus_npc}】\\n内心：{npc1_inner.strip()}\\\
          n外部：{npc1_outer.strip()}\")\n                \n    elif \"玩家与多人\" in player_area_status\
          \ or \"玩家与两人\" in player_area_status:\n        # 都在场，按顺序打包两人\n        if\
