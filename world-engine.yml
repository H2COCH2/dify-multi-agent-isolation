    - data:
        code: "import re\n\ndef main(npc2_name: str, npc2_outer: str, player_area_status:\
          \ str) -> dict:\n    \n    # 1. 判断本轮两人是否在一个场景\n    is_together = \"玩家与多人\"\
          \ in player_area_status or \"玩家独处（他人同行）\" in player_area_status\n    if\
          \ not is_together or not npc2_outer or not npc2_outer.strip():\n       \
          \ return {\"merged_outer\": \"\"}\n        \n    # 2. 按【标签】进行切割，而不是按行切割\n\
          \    # 这一步极其关键，可以完美处理“【全局可见】动作A 【个人隐秘】动作B”写在同一行的情况\n    parts = re.split(r'(【.*?】)',\
          \ npc2_outer)\n    valid_parts = []\n    current_label = \"\"\n    \n  \
          \  for part in parts:\n        if part in [\"【全局可见】\", \"【玩家不知晓】\", \"【其他角色不知晓】\"\
          , \"【个人隐秘】\"]:\n            current_label = part\n        elif part.strip():\n\
          \            # 核心过滤逻辑：只保留“全局可见”和“玩家不知晓”的内容\n            if current_label\
          \ in [\"【全局可见】\", \"【玩家不知晓】\"]:\n                valid_parts.append(part.strip())\n\
          \                \n    # 3. 如果过滤完后没有任何内容了，也返回空\n    if not valid_parts:\n\
          \        return {\"merged_outer\": \"\"}\n        \n    # 4. 拼接过滤后的动作，加上名字锚点，存入上一轮历史\n\
          \    visible_text = \" \".join(valid_parts).strip()\n    name2 = npc2_name\
          \ if npc2_name else \"某个NPC\"\n    merged_text = f\"【{name2} 的动作】\\n{visible_text}\"\
          \n    \n    return {\"merged_outer\": merged_text}"
