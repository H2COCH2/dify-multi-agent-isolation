    - data:
        code: "import json\nimport re\n\ndef main(focus_npc: str, focus_npc2: str,\
          \ player_area_status: str, last_events: str, current_env: str, npc_database:\
          \ str, mem_location_db: str) -> dict:\n    # 1. 解析数据库\n    db_dict = {}\n\
          \    if npc_database and npc_database.strip():\n        try:\n         \
          \   db_dict = json.loads(npc_database)\n        except:\n            db_dict\
          \ = {}\n\n    def get_npc_info(npc_name):\n        if not npc_name or npc_name\
          \ not in db_dict:\n            return \"{}\"\n        return json.dumps(db_dict[npc_name],\
          \ ensure_ascii=False, indent=2)\n\n    # 2. 从外部客观环境中精准提取当前时间\n    current_time\
          \ = \"未知时间\"\n    if current_env and current_env.strip():\n        match\
          \ = re.search(r'^\\[(.*?)\\s*\\|', current_env)\n        if match:\n   \
          \         current_time = match.group(1).strip()\n        else:\n       \
          \     first_line = current_env.strip().split('\\n')[0]\n            if '['\
          \ in first_line and ']' in first_line:\n                current_time = first_line[first_line.find('[')+1:first_line.find(']')].split('|')[0].strip()\n\
          \n    # 3. 提取上一轮最后行动者的名字\n    last_action_name = \"\"\n    if last_events:\n\
          \        match = re.search(r'【(.*?) 的动作】', last_events)\n        if match:\n\
          \            last_action_name = match.group(1)\n\n    # 4. 决定环境、地点库、状态的打包策略\n\
          \    env_for_npc1 = \"\"\n    env_for_npc2 = \"\"\n    loc_db_for_npc1 =\
