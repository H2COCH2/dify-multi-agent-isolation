          \ npc1_status and npc1_outer and npc1_outer.strip():\n        independent_npc_actions.append(f\"\
          【独立行动 NPC：{npc1_name}】\\n{npc1_outer.strip()}\")\n    if \"自主行动\" in npc2_status\
