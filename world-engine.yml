    - data:
        code: "import json\nimport re\n\ndef main(llm_output: str, old_db: str) ->\
          \ dict:\n    # 1. 清理大模型可能带出的 Markdown 标记和废话\n    cleaned_text = re.sub(r'```(json)?',\
          \ '', llm_output, flags=re.IGNORECASE).strip()\n    start_idx = cleaned_text.find('{')\n\
          \    end_idx = cleaned_text.rfind('}')\n    if start_idx != -1 and end_idx\
          \ != -1:\n        cleaned_text = cleaned_text[start_idx:end_idx+1]\n\n \
          \   try:\n        # 2. 解析大模型新输出的数据\n        new_data = json.loads(cleaned_text)\n\
          \        \n        # 3. 解析旧的数据库\n        old_dict = json.loads(old_db) if\
          \ old_db and old_db.strip() else {}\n        \n        # 4. 核心逻辑：只追加，绝不修改已有NPC\n\
          \        for npc_name, npc_info in new_data.items():\n            if npc_name\
          \ not in old_dict:\n                # 如果是全新NPC，追加进数据库\n                old_dict[npc_name]\
          \ = npc_info\n            # 如果NPC已存在，则跳过，完全忽略大模型的输出，保护旧数据\n            \n\
          \        return {\"merged_db\": json.dumps(old_dict, ensure_ascii=False)}\n\
          \        \n    except Exception as e:\n        # 5. 兜底保护\n        return\
          \ {\"merged_db\": old_db if old_db and old_db.strip() else \"{}\"}"
