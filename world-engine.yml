    - data:
        code: "import json\n\ndef main(story_text: str, sub_story: str, \n       \
          \  npc1_name: str, npc1_self: str, npc1_inner: str, npc1_outer: str, npc1_status:\
          \ str,\n         npc2_name: str, npc2_self: str, npc2_inner: str, npc2_outer:\
          \ str, npc2_status: str) -> dict:\n    \n    # 构建单个NPC的数据框（不计算差值，直接读取NPC自己写好的文本）\n\
          \    def build_box(name, self_str):\n        if not name or not self_str\
          \ or self_str.strip() == \"{}\":\n            return \"\"\n        try:\n\
          \            data = json.loads(self_str)\n            \n            # 兼容以前用“当前想法”，现在用“心声”\n\
          \            heart_voice = data.get(\"心声\", data.get(\"当前想法\", \"（无）\"))\n\
          \            if len(heart_voice) > 20:\n                heart_voice = heart_voice[:18]\
          \ + \"...\"\n                \n            # 直接提取带括号的字符串\n            favor\
          \ = data.get(\"好感度\", \"0\")\n            possess = data.get(\"占有欲\", \"\
          0\")\n            intention = data.get(\"意欲\", \"（无）\")\n\n            return\
          \ f\"【{name}】\\n心声：{heart_voice}\\n好感值：{favor}\\n占有欲：{possess}\\n意欲：{intention}\\\
          n\"\n        except:\n            return f\"【{name}】\\n（数据解析失败）\\n\"\n\n\
          \    # ================= 1. 拼装数据面板（可折叠）=================\n    data_box =\
          \ build_box(npc1_name, npc1_self) + build_box(npc2_name, npc2_self)\n  \
          \  data_panel = \"【===数据面板（点击展开）===】\\n```text\\n\" + (data_box.strip()\
          \ if data_box.strip() else \"当前场景没有NPC在场。\") + \"\\n```\\n\\n\"\n\n    #\
          \ ================= 2. 拼装幕后动态（独立行动 / 支线）=================\n    behind_scenes\
          \ = []\n    if \"自主行动\" in npc1_status and npc1_outer and npc1_outer.strip():\n\
          \        behind_scenes.append(f\"【{npc1_name}的独立行动】\\n{npc1_outer.strip()}\"\
          )\n    if \"自主行动\" in npc2_status and npc2_outer and npc2_outer.strip():\n\
          \        behind_scenes.append(f\"【{npc2_name}的独立行动】\\n{npc2_outer.strip()}\"\
          )\n    if sub_story and sub_story.strip():\n        behind_scenes.append(f\"\
          【支线剧情】\\n{sub_story.strip()}\")\n\n    if behind_scenes:\n        behind_panel\
          \ = \"【===幕后动态（点击展开）===】\\n```text\\n\" + \"\\n\\n\".join(behind_scenes)\
          \ + \"\\n```\\n\\n\"\n    else:\n        behind_panel = \"【===幕后动态（点击展开）===】\\\
          n```text\\n关键NPC都在你那里，看什么看！\\n```\\n\\n\"\n\n    # ================= 3.\
          \ 拼装完全内心戏 =================\n    inner_box = []\n    if npc1_name and npc1_inner\
          \ and npc1_inner.strip():\n        inner_box.append(f\"【{npc1_name}的内心戏】\\\
          n{npc1_inner.strip()}\")\n    if npc2_name and npc2_inner and npc2_inner.strip():\n\
          \        inner_box.append(f\"【{npc2_name}的内心戏】\\n{npc2_inner.strip()}\"\
          )\n\n    if inner_box:\n        inner_panel = \"【===完全内心戏（点击展开）===】\\n```text\\\
          n\" + \"\\n\\n\".join(inner_box) + \"\\n```\"\n    else:\n        inner_panel\
          \ = \"【===完全内心戏（点击展开）===】\\n```text\\n当前场景没有NPC内心活动。\\n```\"\n\n    # =================\
          \ 4. 组装最终输出 =================\n    final_output = \"【===主线叙事===】\\n\" +\
          \ story_text.strip() + \"\\n\\n\" + data_panel + behind_panel + inner_panel\n\
          \n    return {\"final_output\": final_output.strip()}"
        code_language: python3
