        code: "import json\nimport re\n\ndef main(llm_output: str, loc_name: str,\
          \ mem_location_db: str) -> dict:\n    # 初始化变量\n    pure_story = \"\"\n \
          \   new_base_env = \"\"\n    updated_db = mem_location_db\n\n    # 1. 解析\
          \ LLM 输出，提取 story 和 base_env\n    if llm_output and llm_output.strip():\n\
          \        # 核心改进 1：先清理 <think> 标签，再清理 Markdown 标记\n        cleaned_text =\
          \ re.sub(r'<think>.*?</think>', '', llm_output, flags=re.DOTALL | re.IGNORECASE).strip()\n\
          \        cleaned_text = re.sub(r'```(json)?', '', cleaned_text, flags=re.IGNORECASE).strip()\n\
          \        \n        # 截取大括号部分\n        start_idx = cleaned_text.find('{')\n\
          \        end_idx = cleaned_text.rfind('}')\n        if start_idx != -1 and\
          \ end_idx != -1:\n            cleaned_text = cleaned_text[start_idx:end_idx+1]\n\
          \            \n        try:\n            data = json.loads(cleaned_text)\n\
          \            pure_story = data.get(\"story\", \"\").strip()\n          \
          \  new_base_env = data.get(\"base_env\", \"\").strip()\n        except Exception\
          \ as e:\n            # 兜底：解析失败，把全文当故事，放弃提取环境，确保工作流不崩溃\n            pure_story\
          \ = llm_output.strip()\n            new_base_env = \"\"\n\n    # 2. 安全更新环境库（如果有新环境）\n\
          \    if new_base_env and loc_name and loc_name != \"未知地点\":\n        try:\n\
          \            # 读取旧库（如果为空则初始化）\n            db = json.loads(mem_location_db)\
          \ if mem_location_db and mem_location_db.strip() else {}\n            \n\
          \            # 核心保护逻辑：如果地点不存在，才追加。如果已存在，绝对不覆盖！\n            if loc_name\
          \ not in db:\n                db[loc_name] = new_base_env\n            \
          \    \n            updated_db = json.dumps(db, ensure_ascii=False)\n   \
          \     except Exception as e:\n            # 如果数据库解析失败，原样返回，防崩溃\n       \
          \     updated_db = mem_location_db\n\n    return {\n        \"pure_story\"\
          : pure_story,\n        \"updated_db\": updated_db\n    }"
