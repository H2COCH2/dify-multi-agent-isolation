          \     return {\"npc1_action_for_npc2\": \"\"}\n\n    # 2. 过滤 NPC1 的外部表现\n\
          \    visible_text = \"\"\n    if npc1_outer and npc1_outer.strip():\n  \
          \      # 核心修复：按【标签】进行切割和过滤，完美处理同一行多标签\n        parts = re.split(r'(【.*?】)',\
          \ npc1_outer)\n        valid_parts = []\n        current_label = \"\"\n\
          \        \n        for part in parts:\n            if part in [\"【全局可见】\"\
          , \"【玩家不知晓】\", \"【其他角色不知晓】\", \"【个人隐秘】\"]:\n                current_label\
          \ = part\n            elif part.strip():\n                if current_label\
          \ in [\"【全局可见】\", \"【玩家不知晓】\"]:\n                    valid_parts.append(part.strip())\n\
          \                    \n        visible_text = \" \".join(valid_parts).strip()\n\
          \n    # 3. 如果没有可见动作，直接返回空\n    if not visible_text:\n        return {\"\
          npc1_action_for_npc2\": \"\"}\n\n    # 4. 打包逻辑：根据状态决定是否把“时空”融合进去\n    if\
          \ \"玩家独处（他人同行）\" in player_area_status and npc1_updated_self and npc1_updated_self.strip()\
          \ != \"{}\":\n        try:\n            data = json.loads(npc1_updated_self)\n\
          \            sync_time_space = data.get(\"当前时空\", \"\")\n            # 如果有精准的时空，就把它和动作打包在一起，加上明确的解释\n\
          \            if sync_time_space:\n                action_text = f\"【本轮与你同行的\
          \ {npc1_name} 刚刚做了什么（他当前所在地点：{sync_time_space}）】\\n{visible_text}\"\n  \
          \              return {\"npc1_action_for_npc2\": action_text}\n        except:\n\
