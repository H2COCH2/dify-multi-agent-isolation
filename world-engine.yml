    - data:
        code: "import json\nimport re\n\ndef main(llm_output: str) -> dict:\n    #\
          \ 1. 清理大模型可能多输出的 Markdown 标记（如 ```json 和 ```）\n    cleaned_text = re.sub(r'```(json)?',\
          \ '', llm_output, flags=re.IGNORECASE).strip()\n    \n    # 2. 尝试找到第一个 {\
          \ 和最后一个 }，防住大模型废话\n    start_idx = cleaned_text.find('{')\n    end_idx =\
          \ cleaned_text.rfind('}')\n    if start_idx != -1 and end_idx != -1:\n \
          \       cleaned_text = cleaned_text[start_idx:end_idx+1]\n\n    try:\n \
          \       # 3. 解析JSON\n        data = json.loads(cleaned_text)\n        \n\
          \        # 4. 提取更新字段，并安全地转换为JSON字符串\n        updated_self = data.get(\"\
          updated_self\", {})\n        updated_static = data.get(\"updated_static\"\
          , {})\n        \n        return {\n            \"npc1_inner\": data.get(\"\
          inner\", \"\"),\n            \"npc1_outer\": data.get(\"outer\", \"\"),\n\
          \            \"npc1_updated_self\": json.dumps(updated_self, ensure_ascii=False),\n\
          \            \"npc1_updated_static\": json.dumps(updated_static, ensure_ascii=False)\n\
          \        }\n    except Exception as e:\n        # 5. 兜底：如果解析失败，返回报错信息，避免工作流崩溃\n\
          \        return {\n            \"npc1_inner\": f\"解析失败: {str(e)}\",\n  \
          \          \"npc1_outer\": \"解析失败，请检查LLM输出格式。\",\n            \"npc1_updated_self\"\
          : \"{}\",\n            \"npc1_updated_static\": \"{}\"\n        }"
