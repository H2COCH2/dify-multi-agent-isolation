          \ 2. 拼接历史（旧历史 + 本轮新事件）\n        # 如果旧历史为空，直接存新事件\n        if not old_history\
          \ or not old_history.strip():\n            merged = new_event\n        else:\n\
          \            merged = old_history.strip() + \"\\n\" + new_event\n\n    \
          \    return {\"merged_history\": merged.strip()}\n        \n    except Exception\
          \ as e:\n        # 防崩溃兜底\n        return {\"merged_history\": old_history}"
